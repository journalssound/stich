name: Build Stich Plugin

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"

      - name: Build
        run: cmake --build build --config Release --parallel $(sysctl -n hw.logicalcpu)

      - name: Debug - find all artifacts
        if: always()
        run: find build/Stich_artefacts -type f 2>/dev/null || echo "No artifacts found"

      - name: Package VST3
        run: |
          cd build/Stich_artefacts/Release/VST3
          zip -r ../../../../Stich-VST3-macOS.zip Stich.vst3

      - name: Package AU
        run: |
          cd build/Stich_artefacts/Release/AU
          zip -r ../../../../Stich-AU-macOS.zip Stich.component

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Stich-VST3-macOS
          path: Stich-VST3-macOS.zip

      - name: Upload AU
        uses: actions/upload-artifact@v4
        with:
          name: Stich-AU-macOS
          path: Stich-AU-macOS.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Debug - find all artifacts
        if: always()
        shell: bash
        run: find build/Stich_artefacts -type f 2>/dev/null || echo "No artifacts found"

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Stich-VST3-Windows
          path: build/Stich_artefacts/Release/VST3/Stich.vst3
          if-no-files-found: error

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Stich Build #${{ github.run_number }}"
          body: |
            Automated build of Stich granular effects plugin.

            **macOS** (Universal - Intel + Apple Silicon):
            - `Stich-VST3-macOS.zip` — for any VST3 host (Ableton, Bitwig, REAPER, etc.)
            - `Stich-AU-macOS.zip` — for Audio Unit hosts (Logic Pro, GarageBand, Ableton, etc.)

            **Windows:**
            - `Stich-VST3-Windows.zip` — VST3 for Windows DAWs

            ### Install
            **macOS:** Unzip and copy to `~/Library/Audio/Plug-Ins/VST3/` or `~/Library/Audio/Plug-Ins/Components/`
            **Windows:** Unzip and copy to `C:\Program Files\Common Files\VST3\`
          files: |
            artifacts/Stich-VST3-macOS/Stich-VST3-macOS.zip
            artifacts/Stich-AU-macOS/Stich-AU-macOS.zip
            artifacts/Stich-VST3-Windows/Stich.vst3
